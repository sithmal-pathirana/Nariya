apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nariya-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # Essential for NGINX: increase proxy body size for large mock payloads (e.g. 10MB)
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # SSL/TLS termination automatically handled if cert-manager is installed
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  # tls:
  # - hosts:
  #   - api.nariya.devtools
  #   secretName: nariya-tls-secret
  rules:
  - host: api.nariya.devtools  # Replace with actual domain pointing to the Oracle instance
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nariya-backend-service
            port:
              number: 80
